<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082C66" />
      <stop offset="50%" stop-color="#0647A5" />
      <stop offset="100%" stop-color="#079BEF" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6500" />
      <stop offset="100%" stop-color="#FFB900" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#079BEF" />
      <stop offset="100%" stop-color="#0647A5" />
    </linearGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#082C66" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ICON / EMBLEM -->
  <g transform="translate(15, 10)">
    <!-- Base 3D Shield / Hexagon Backdrop -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="#082C66" opacity="0.04" />
    
    <!-- Stylized 3D "N" Dynamic Interlocking Workforce Pillars -->
    <!-- Left Pillar (Blue Gradient) -->
    <path d="M 22 82 L 22 28 C 22 22 27 18 33 18 L 37 18 C 42 18 46 22 46 28 L 46 82 C 46 87 42 91 37 91 L 33 91 C 27 91 22 87 22 82 Z" fill="url(#blueGrad)" filter="url(#shadowFilter)" />
    
    <!-- Diagonal Dynamic Connector / Upward Arrow (Orange to Yellow Gradient) -->
    <path d="M 33 24 L 75 72 C 78 75 80 80 77 84 C 74 88 68 87 64 83 L 26 38 C 23 35 24 30 28 26 C 30 24 32 23 33 24 Z" fill="url(#orangeGrad)" filter="url(#shadowFilter)" />
    
    <!-- Right Pillar (Bright Blue Gradient with Apex Arrow) -->
    <path d="M 64 82 L 64 36 C 64 31 68 27 73 25 L 77 23 C 82 21 88 25 88 31 L 88 82 C 88 87 84 91 79 91 L 73 91 C 68 91 64 87 64 82 Z" fill="url(#accentGrad)" />

    <!-- Upward Momentum Synergy Node / People Circle -->
    <circle cx="55" cy="22" r="10" fill="url(#orangeGrad)" filter="url(#shadowFilter)" />
    <circle cx="55" cy="22" r="4" fill="#FFFFFF" />
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(135, 20)">
    <!-- Brand Title: NEXGEN -->
    <text x="0" y="44" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="44" fill="#082C66" letter-spacing="1.5">
      NEX<tspan fill="#FF6500">GEN</tspan>
    </text>

    <!-- Subtitle: WORKFORCE SERVICES -->
    <text x="3" y="68" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="14.5" fill="#0647A5" letter-spacing="5.5">
      WORKFORCE SERVICES
    </text>

    <!-- Brand Tagline: Build People, Build Success. -->
    <g transform="translate(3, 85)">
      <!-- Little Orange Diamond Divider -->
      <polygon points="0,3 4,0 8,3 4,6" fill="#FF6500" />
      <text x="16" y="5" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="11" fill="#252B35" letter-spacing="1">
        Build People, Build Success.
      </text>
    </g>
  </g>
</svg>
